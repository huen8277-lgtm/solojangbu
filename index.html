<html lang="ko">
<head>
<meta charset="utf-8">

<title>솔로 장부</title>

<style>
/* Layout: 사진 중심 카드 인덱스 그리드 + 상단 필터 레일, 상세/등록은 오버레이 시트 */
:root {
  --bg: #F5F4F7; --surface: #FFFFFF; --sunk: #EEECF2; --ink: #1D1A27; --muted: #6B6679; --line: #E3E0EA;
  --accent: #C2185B; --accent-soft: #FBE4EE; --on-accent: #FFFFFF;
  --ok: #2E7D5B; --ok-soft: #E1F2E9; --warn: #A86A12; --warn-soft: #FBEFD9; --off: #7E7A8A; --off-soft: #ECEAF0;
  --shadow: 0 1px 2px rgba(29,26,39,.06), 0 6px 18px rgba(29,26,39,.06);
  --f-display: "Gowun Batang", "Nanum Myeongjo", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15131B; --surface: #1F1C27; --sunk: #191720; --ink: #EEEAF4; --muted: #A29DB0; --line: #302C3B;
  --accent: #F06292; --accent-soft: #3A1F2C; --on-accent: #1A0E14;
  --ok: #5CC08F; --ok-soft: #1B3328; --warn: #E0A84A; --warn-soft: #3A2E18; --off: #8F8A9C; --off-soft: #2A2733;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #15131B; --surface: #1F1C27; --sunk: #191720; --ink: #EEEAF4; --muted: #A29DB0; --line: #302C3B;
  --accent: #F06292; --accent-soft: #3A1F2C; --on-accent: #1A0E14;
  --ok: #5CC08F; --ok-soft: #1B3328; --warn: #E0A84A; --warn-soft: #3A2E18; --off: #8F8A9C; --off-soft: #2A2733;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 64px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { font-family: var(--f-display); font-size: 28px; margin: 0; letter-spacing: -.01em; }
.brand small { color: var(--muted); font-size: 13px; }
.tabs { display: flex; gap: 4px; background: var(--sunk); padding: 4px; border-radius: 999px; }
.tabs button { border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; font-size: 14px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.tabs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }
.badge { background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 600; min-width: 18px; height: 18px; border-radius: 9px; display: inline-grid; place-items: center; padding: 0 5px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 10px; font-size: 14px; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.filters { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 14px 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 5px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); font-weight: 600; }
.search { flex: 1 1 220px; min-width: 0; display: flex; gap: 8px; }
.search input, .search select { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 12px; font-size: 14px; }
.search select { flex: 0 1 160px; }
.count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; text-align: left; padding: 0; display: flex; flex-direction: column; transition: transform .15s ease, box-shadow .15s ease; }
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.card.closed { opacity: .6; }
.photo { position: relative; aspect-ratio: 4 / 5; background: var(--sunk); width: 100%; max-width: 100%; overflow: hidden; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
.photo .ph b { font-family: var(--f-display); font-size: 40px; color: var(--line); display: block; text-align: center; }
.stamp { position: absolute; top: 10px; left: 10px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 6px; letter-spacing: .02em; }
.st-solo { background: var(--ok-soft); color: var(--ok); }
.st-meeting { background: var(--warn-soft); color: var(--warn); }
.st-closed { background: var(--off-soft); color: var(--off); }
.gender { position: absolute; top: 10px; right: 10px; font-size: 12px; font-weight: 600; background: var(--surface); color: var(--ink); padding: 3px 8px; border-radius: 6px; }
.pcount { position: absolute; bottom: 8px; right: 8px; font-size: 11px; background: rgba(0,0,0,.55); color: #fff; padding: 2px 7px; border-radius: 999px; }
.card .body { padding: 12px 14px 14px; display: grid; gap: 4px; min-width: 0; }
.card .name { font-family: var(--f-display); font-size: 18px; line-height: 1.3; }
.card .meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.card .mm { font-size: 12px; color: var(--muted); margin-top: 4px; display: flex; gap: 6px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

.group { margin-bottom: 28px; }
.group h2 { font-family: var(--f-display); font-size: 20px; margin: 0 0 12px; display: flex; gap: 10px; align-items: center; }
.group h2 span { font-family: var(--f-body); font-size: 13px; color: var(--muted); font-weight: 400; }

.empty { border: 1.5px dashed var(--line); border-radius: 16px; padding: 40px 20px; text-align: center; color: var(--muted); display: grid; gap: 12px; justify-items: center; }
.empty h3 { font-family: var(--f-display); color: var(--ink); font-size: 20px; margin: 0; }
.empty p { margin: 0; max-width: 46ch; }

/* 신청함 */
.inbox { display: grid; gap: 28px; }
.inbox h2 { font-family: var(--f-display); font-size: 20px; margin: 0 0 10px; }
.req { display: flex; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; flex-wrap: wrap; }
.req .thumb { width: 56px; height: 70px; border-radius: 8px; overflow: hidden; background: var(--sunk); flex: none; }
.req .thumb img { width: 100%; height: 100%; object-fit: cover; }
.req .info { flex: 1 1 220px; min-width: 0; display: grid; gap: 2px; }
.req .info b { font-weight: 600; }
.req .note { font-size: 13px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.req .act { display: flex; gap: 6px; }
.pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 6px; }
.p-pending { background: var(--warn-soft); color: var(--warn); }
.p-accepted { background: var(--ok-soft); color: var(--ok); }
.p-declined { background: var(--off-soft); color: var(--off); }
.list { display: grid; gap: 10px; }
.muted { color: var(--muted); }

/* sheets */
.overlay { position: fixed; inset: 0; background: rgba(15,12,22,.5); z-index: 20; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--surface); border-radius: 18px; width: min(860px, 100%); max-height: 100%; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.sheet-head { position: sticky; top: 0; background: var(--surface); display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); z-index: 1; }
.sheet-head h2 { font-family: var(--f-display); font-size: 20px; margin: 0; margin-right: auto; }
.x { border: 0; background: var(--sunk); width: 32px; height: 32px; border-radius: 50%; font-size: 18px; line-height: 1; }
.sheet-body { padding: 20px; display: grid; gap: 18px; }
.sheet-foot { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 20px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

.detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 22px; }
@media (max-width: 680px) { .detail { grid-template-columns: minmax(0, 1fr); } }
.gallery { display: grid; gap: 8px; }
.gallery .main { aspect-ratio: 4 / 5; border-radius: 12px; overflow: hidden; background: var(--sunk); position: relative; }
.gallery .main img { width: 100%; height: 100%; object-fit: cover; }
.thumbs { display: flex; gap: 6px; flex-wrap: wrap; }
.thumbs button { width: 54px; height: 54px; padding: 0; border-radius: 8px; overflow: hidden; border: 2px solid transparent; background: var(--sunk); }
.thumbs button[aria-current="true"] { border-color: var(--accent); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; }
.facts { display: grid; gap: 0; margin: 0; }
.facts div { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.facts dt { color: var(--muted); font-size: 13px; }
.facts dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.headline { font-family: var(--f-display); font-size: 26px; margin: 0; line-height: 1.25; text-wrap: balance; }
.sub { color: var(--muted); font-size: 14px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
details.raw summary { cursor: pointer; color: var(--muted); font-size: 13px; }
details.raw pre { white-space: pre-wrap; font-family: var(--f-body); font-size: 13px; background: var(--sunk); padding: 12px; border-radius: 10px; margin: 8px 0 0; overflow-wrap: anywhere; }
.callout { background: var(--accent-soft); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }

/* forms */
.field { display: grid; gap: 6px; }
.field label, .lbl { font-size: 13px; font-weight: 600; }
.field .hint { font-size: 12px; color: var(--muted); }
input[type="text"], textarea, select.in { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 12px; font-size: 14px; }
textarea { resize: vertical; min-height: 200px; line-height: 1.6; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 680px) { .two { grid-template-columns: minmax(0, 1fr); } }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 8px 18px; font-size: 14px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }
.drop { border: 1.5px dashed var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 10px; text-align: center; color: var(--muted); font-size: 13px; background: var(--bg); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.pics { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.pic { position: relative; width: 76px; height: 95px; border-radius: 8px; overflow: hidden; background: var(--sunk); }
.pic img { width: 100%; height: 100%; object-fit: cover; }
.pic button { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 13px; line-height: 1; }
.pic .up { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.45); color: #fff; font-size: 11px; }
.preview { background: var(--sunk); border-radius: 12px; padding: 4px 14px; }
.preview .facts div { grid-template-columns: 80px minmax(0, 1fr); padding: 7px 0; }
.preview .facts div:last-child { border-bottom: 0; }

.imp-item { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; align-items: start; }
.imp-item .sum { display: grid; gap: 6px; min-width: 0; }
.imp-item .sum b { font-family: var(--f-display); font-size: 16px; }
.imp-item.dup { opacity: .55; }

.gate { min-height: 70vh; display: grid; place-items: center; }
.gate-box { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 28px 24px; display: grid; gap: 16px; box-shadow: var(--shadow); }
.gate-box h1 { font-family: var(--f-display); font-size: 32px; margin: 0; }
.gate-box p { margin: 0; color: var(--muted); }
.me { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 40; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.notice { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 14px; font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
</style>
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* 사진 워터마크: 보는 사람 이름이 찍혀 캡처 유출을 막는 용도 */
.wm { position: absolute; inset: 0; pointer-events: none; overflow: hidden; display: grid; place-items: center; }
.wm span { transform: rotate(-24deg); font-size: 13px; font-weight: 600; color: rgba(255,255,255,.55); text-shadow: 0 0 2px rgba(0,0,0,.5); white-space: pre; line-height: 3.2; text-align: center; user-select: none; }
.photo img, .gallery img, .pic img, .thumb img { -webkit-user-drag: none; user-select: none; -webkit-touch-callout: none; }
.card { cursor: pointer; }
.mm-bar { display: flex; gap: 6px; overflow-x: auto; padding: 14px 0 2px; scrollbar-width: none; }
.mm-bar::-webkit-scrollbar { display: none; }
.mm-tab { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 12px; font-size: 14px; color: var(--muted); }
.mm-tab span { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); }
.mm-tab .dot { width: 8px; height: 8px; border-radius: 50%; }
.mm-tab[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 600; }
.mm-tab[aria-pressed="true"] span { color: var(--bg); opacity: .7; }
.ledger { display: grid; gap: 8px; }
.basket .btn { white-space: nowrap; }
.lrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: stretch; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.lrow.picked { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.lrow.closed { opacity: .6; }
.delbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--accent); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
.delbar b { margin-right: auto; }
.btn.danger-fill { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger-fill:disabled { opacity: .4; }
.lrow.del-picked { border-color: var(--accent); background: var(--accent-soft); }
.del-mode .lcheck input { accent-color: var(--accent); }
.mm-tab.mine { border-style: dashed; }
.mm-tab.mine[aria-pressed="true"] { border-style: solid; }
.pic { cursor: grab; }
.pic.cover { outline: 2px solid var(--accent); outline-offset: 1px; }
.pic.dragging { opacity: .4; }
.pic.drop-target { outline: 2px dashed var(--accent); outline-offset: 2px; }
.pic .pic-x { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 13px; line-height: 1; }
.cover-tag, .num-tag { position: absolute; top: 3px; left: 3px; font-size: 10px; font-weight: 700; border-radius: 4px; padding: 1px 5px; }
.cover-tag { background: var(--accent); color: var(--on-accent); }
.num-tag { background: rgba(0,0,0,.55); color: #fff; }
.pic-move { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; }
.pic-move button { position: static; width: 26px; height: 24px; border: 0; border-radius: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 16px; line-height: 1; padding: 0; }
.pic-move button:disabled { opacity: 0; }
.ldel { border: 0; border-left: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 12px; padding: 0 12px; min-width: 52px; }
.ldel:hover { color: var(--accent); }
.ldel.armed { background: var(--accent); color: var(--on-accent); }
.lcheck { display: grid; place-items: center; padding: 0 6px 0 12px; cursor: pointer; }
.lcheck input { width: 20px; height: 20px; accent-color: var(--accent); }
.lmain { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; border: 0; background: transparent; text-align: left; padding: 10px 12px 10px 4px; min-width: 0; }
.lthumb { width: 56px; height: 70px; border-radius: 8px; overflow: hidden; background: var(--sunk); display: grid; place-items: center; color: var(--muted); font-family: var(--f-display); font-size: 22px; position: relative; }
.lthumb img { width: 100%; height: 100%; object-fit: cover; }
.linfo { min-width: 0; display: grid; gap: 2px; }
.lname { font-weight: 600; display: flex; align-items: center; gap: 6px; min-width: 0; overflow-wrap: anywhere; }

.g { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 0 5px; flex: none; }

.links { display: grid; gap: 12px; }

.link-body { display: grid; gap: 10px; padding: 0 16px 14px; }

.pick.done { opacity: .6; }
.pick .info { flex: 1 1 200px; min-width: 0; display: grid; gap: 2px; }
.pick .note { font-size: 12px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.pick .act { display: flex; gap: 6px; flex-wrap: wrap; }
.mm-msgs { border-top: 1px solid var(--line); padding-top: 16px; }
.mm-msgs summary { cursor: pointer; font-weight: 600; }
.sub-h { font-size: 15px; margin: 0 0 8px; }
.mm-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; font-size: 14px; }
.mm-head b { font-family: var(--f-display); font-size: 20px; }
.dex { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.timer { font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }

.pill.vis-blind { background: var(--sunk); color: var(--muted); } .pill.vis-open { background: var(--ok-soft); color: var(--ok); } .pill.vis-private { background: var(--warn-soft); color: var(--warn); }
.card.picked { outline: 2px solid var(--accent); outline-offset: -2px; }

.new { display: inline-block; margin-left: 6px; vertical-align: middle; font-family: var(--f-body); font-size: 10px; font-weight: 700; letter-spacing: .04em; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 4px; }
.basket { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 15; display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 8px 8px 18px; box-shadow: 0 10px 30px rgba(0,0,0,.18); max-width: calc(100% - 32px); }
.sharepage { max-width: 620px; margin: 0 auto; display: grid; gap: 18px; padding-block: 8px 40px; }

.share-head h1 { font-family: var(--f-display); font-size: 26px; margin: 0; text-wrap: balance; }

.share-head .callout { color: var(--ink); }
.share-list { display: grid; gap: 18px; }
.share-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.strip { display: flex; gap: 4px; overflow-x: auto; scroll-snap-type: x mandatory; }
.shot { position: relative; flex: 0 0 85%; max-width: 85%; aspect-ratio: 4 / 5; scroll-snap-align: start; background: var(--sunk); }
.strip .shot:only-child { flex-basis: 100%; max-width: 100%; }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sharepage input[type="text"] { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 15px; }
.consent { display: flex; gap: 10px; align-items: flex-start; background: var(--sunk); border-radius: 10px; padding: 12px; font-size: 13px; }
.consent input { margin-top: 3px; width: 16px; height: 16px; flex: none; }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(() => {
  const cfg = window.SOLO_CONFIG || {};
  const sb = window.supabase && cfg.SUPABASE_URL && !/YOUR/.test(cfg.SUPABASE_URL)
    ? window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY) : null;

  // ---------- state ----------
  const S = {
    session: null, me: null, isAdmin: false,
    profiles: [], requests: [], members: [], names: {}, urls: {}, shares: [], picks: [], basket: new Set(), lastSeen: null, access: [], dex: {}, openLinks: new Set(), mine: false, delMode: false, delSel: new Set(),
    tab: "all", g: "all", s: "solo", q: "", mm: "", loaded: false,
  };
  const STATUS = { solo: "소개팅 가능", meeting: "진행중", closed: "마감" };
  const VIS = { blind: "승인 후 공개", open: "전체 공개", private: "나만 보기" };
  const GENDER = { F: "여", M: "남" };
  const THIS_YEAR = new Date().getFullYear();

  // ---------- helpers ----------
  const $ = (s, r = document) => r.querySelector(s);
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "text") el.textContent = v;
      else el.setAttribute(k, v === true ? (k.startsWith("aria-") ? "true" : "") : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
    return el;
  }
  let toastT;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2800); }
  const norm = s => (s || "").replace(/\s+/g, "").toLowerCase();
  const photoUrl = path => S.urls[path] || "";
  const blurOf = path => path.replace(/\/([^/]+)$/, "/blur/$1");
  const lockMark = () => h("div", { class: "lock" }, h("span", { text: "주선자 승인 후 공개" }));
  const wm = () => { const t = `${S.myName || ""} ${S.phoneTail ? "·" + S.phoneTail : ""}  솔로 장부`; return h("div", { class: "wm", "aria-hidden": "true" }, h("span", { text: Array(6).fill(t + "     " + t).join("\n") })); };
  document.addEventListener("contextmenu", e => { if (e.target.tagName === "IMG") e.preventDefault(); });

  // ---------- 카톡 양식 파서 ----------
  const KEYMAP = [
    ["gender", /성별/], ["age", /나이|년생|출생|생년|연령/], ["height", /^키$|^신장|^키\(/],
    ["job", /하는일|직업|직장|^일$|회사|직무|업무/], ["region", /사는곳|거주|지역|사는동네|사는데|동네|주소/],
    ["mbti", /mbti/i], ["hobby", /취미|관심사|특기/], ["smoke", /흡연|종교|음주|술|담배/], ["wants", /원하는|이상형|바라는|희망|조건|선호/],
  ];
  // 콜론 없이 "키 165" 처럼 쓴 줄을 알아보기 위한 항목 이름들 (긴 것부터)
  const BARE_KEYS = ["하는 일", "하는일", "사는 곳", "사는곳", "거주지", "거주", "지역", "나이", "출생", "생년", "성별", "신장", "키",
    "직업", "직장", "회사", "직무", "MBTI", "mbti", "엠비티아이", "취미", "관심사", "흡연", "종교", "음주", "원하는 점", "원하는점", "원하는 사람", "이상형", "선호", "조건"];
  const bareRe = new RegExp("^(?:\\d+\\s*[.)]\\s*|[-•·*▶︎>]\\s*)?(" + BARE_KEYS.map(k => k.replace(/\s/g, "\\s?")).join("|") + ")\\s+(.+)$", "i");
  function keyOf(k) { const n = norm(k); for (const [key, re] of KEYMAP) if (re.test(n)) return key; return null; }
  // 항목 이름 없이 쓴 줄을 내용으로 짐작
  function guessKeyOfLine(v) {
    if (/(까지|이상|이하|연상|연하|선호|원해|원함|좋겠|였으면|이면\s*좋|가능)/.test(v) && /(년생|살|세|키|cm|연상|연하|나이|사람|분)/.test(v)) return "원하는 점";
    if (/^\s*\d{2,4}\s*년\s*생\s*$|^\s*(19|20)?\d{2}\s*년생/.test(v)) return "나이";
    if (/^\s*1\d{2}\s*(cm|센티)?\s*$/i.test(v)) return "키";
    if (/^\s*[EI][NS][TF][JP]\s*$/i.test(v)) return "MBTI";
    return null;
  }
  function parseForm(text) {
    const fields = []; let cur = null; let curOpen = false;   // curOpen: 값 없이 시작한 항목(아래 줄들이 그 값)
    for (const raw of (text || "").split(/\r?\n/)) {
      const line = raw.trim(); if (!line) continue;
      let m = line.match(/^(?:\d+\s*[.)]\s*|[-•·*▶︎>]\s*)?([^:：]{1,20}?)\s*[:：]\s*(.*)$/);
      if (m && !/^https?$/i.test(m[1].trim())) { cur = { k: m[1].trim(), v: m[2].trim() }; curOpen = !cur.v; fields.push(cur); continue; }
      m = line.match(bareRe);
      if (m) { cur = { k: m[1].replace(/\s+/g, " ").trim(), v: m[2].trim() }; curOpen = false; fields.push(cur); continue; }
      m = line.match(/^\d+\s*[.)]\s*(.{1,20})$/);
      if (m) { cur = { k: m[1].trim(), v: "" }; curOpen = true; fields.push(cur); continue; }
      const isBullet = /^[-•·*]/.test(line);
      const b = line.replace(/^[-•·*]\s*/, "");
      if (cur && (curOpen || isBullet)) { cur.v = cur.v ? cur.v + "\n" + b : b; continue; }
      const gk = guessKeyOfLine(b);
      if (gk) { const ex = fields.find(f => f.k === gk); if (ex) ex.v += "\n" + b; else fields.push(cur = { k: gk, v: b }); curOpen = false; continue; }
      const memo = fields.find(f => f.k === "기타");
      if (memo) memo.v += "\n" + b; else fields.push(cur = { k: "기타", v: b });
      curOpen = false;
    }
    const out = { fields: fields.filter(f => f.v) };
    for (const f of out.fields) { const key = keyOf(f.k); if (key && !out[key]) out[key] = f.v; }
    if (out.age) {
      let m = out.age.match(/(\d{2,4})\s*년\s*생|(\d{2,4})년생|^(\d{2,4})\s*$/);
      let y = m && +(m[1] || m[2] || m[3]);
      if (!y) { const a = out.age.match(/(\d{2})\s*(?:살|세)/); if (a) y = THIS_YEAR - (+a[1]) + 1; }
      if (y && y < 100) y += y > 30 ? 1900 : 2000;
      if (y > 1950 && y <= THIS_YEAR) out.birthYear = y;
    }
    if (out.height) { const m = out.height.match(/(1\d{2})/); if (m) out.heightCm = +m[1]; }
    if (!out.heightCm) { const m = (text || "").match(/(?:^|[\s/,·])(1[4-9]\d)\s*(?:cm|센티)?(?=$|[\s/,·])/im); if (m) out.heightCm = +m[1]; }
    if (out.mbti) { const m = out.mbti.match(/[EI][NS][TF][JP]/i); if (m) out.mbtiCode = m[0].toUpperCase(); }
    if (!out.mbtiCode) { const m = (text || "").match(/\b([EI][NS][TF][JP])\b/i); if (m) out.mbtiCode = m[1].toUpperCase(); }
    if (out.gender) out.g = /여/.test(out.gender) ? "F" : /남/.test(out.gender) ? "M" : null;
    // 지역: "경기도 광주/회사 : 성수" → 거주 + 직장 위치, "서울대입구 거주" → "서울대입구"
    if (out.region) {
      let home = out.region.split("\n")[0], work = "";
      const m = home.match(/^(.*?)\s*[\/,·|]\s*(?:회사|직장|근무지?|출근)\s*[:：]?\s*(.+)$/);
      if (m) { home = m[1]; work = m[2]; }
      const clean = v => { let x = v, prev; do { prev = x; x = x.replace(/\s*(에\s*)?(거주\s*중?|거주해요|거주합니다|살아요|삽니다|살고\s*있어요|사는\s*중|쪽|근처|부근)\s*$/, "").trim(); } while (x !== prev && x); return x || v.trim(); };
      out.home = clean(home); out.workArea = clean(work);
    }
    // 원하는 점에서 나이 조건만 따로: "위로 92년생 까지 가능", "아래로 01년생", "92~97년생", "연상 3살까지"
    if (out.wants) {
      const ageBits = [], rest = [];
      const yy = n => { n = +n; return n < 100 ? (n > 30 ? 1900 + n : 2000 + n) : n; };
      const lo = [], hi = [];   // lo: 가장 나이 많은 쪽(출생년도 작은 값), hi: 가장 어린 쪽
      for (const line of out.wants.split("\n")) {
        let hit = false, m;
        if ((m = line.match(/(?:위로|위\s*로는|연상은?)\s*(\d{2,4})\s*년생?/))) { lo.push(yy(m[1])); hit = true; }
        if ((m = line.match(/(?:아래로|밑으로|연하는?)\s*(\d{2,4})\s*년생?/))) { hi.push(yy(m[1])); hit = true; }
        if ((m = line.match(/(\d{2,4})\s*(?:년생)?\s*[~\-–]\s*(\d{2,4})\s*년생/))) { const a = yy(m[1]), b = yy(m[2]); lo.push(Math.min(a, b)); hi.push(Math.max(a, b)); hit = true; }
        if (out.birthYear && (m = line.match(/연상\s*(\d{1,2})\s*살/))) { lo.push(out.birthYear - +m[1]); hit = true; }
        if (out.birthYear && (m = line.match(/연하\s*(\d{1,2})\s*살/))) { hi.push(out.birthYear + +m[1]); hit = true; }
        if (out.birthYear && /동갑/.test(line) && !/연하/.test(line)) { hi.push(out.birthYear); hit = true; }
        const leftover = line.replace(/(\d+|년생|년|위로는?|아래로는?|밑으로|까지|가능|연상은?|연하는?|살|동갑|선호|희망|원해요?|원함|이상|이하|좋아요|괜찮아요|ok|[~\-–,.!·\s])/gi, "");
        (hit && !leftover ? ageBits : rest).push(line);
      }
      if (lo.length || hi.length) {
        const a = lo.length ? Math.min(...lo) : null, b = hi.length ? Math.max(...hi) : null;
        const sy = y => `${String(y).slice(2)}년생`;
        const rel = y => out.birthYear ? (y < out.birthYear ? ` (연상 ${out.birthYear - y}살)` : y > out.birthYear ? ` (연하 ${y - out.birthYear}살)` : " (동갑)") : "";
        out.wantAge = a && b ? `${sy(a)} ~ ${sy(b)}` : a ? `${sy(a)}까지${rel(a)}` : `${sy(b)}까지${rel(b)}`;
        out.wantsRest = rest.join("\n");
      } else out.wantsRest = out.wants;
    }
    out.score = ["age","height","job","region","mbti","hobby","wants"].filter(k => out[k]).length;
    return out;
  }
  const rawKey = t => norm(t).replace(/[^0-9a-z가-힣]/g, "").slice(0, 400);

  // 카톡 시간 → Date (분 단위)
  function kTime(y, mo, d, ampm, hh, mm) {
    let H = +hh; if (ampm === "오후" && H < 12) H += 12; if (ampm === "오전" && H === 12) H = 0;
    return new Date(+y, +mo - 1, +d, H, +mm).getTime();
  }
  function parseChat(text) {
    const msgs = []; let cur = null; let date = "", ymd = null;
    const reDate = /^-{3,}\s*((\d{4})년\s*(\d{1,2})월\s*(\d{1,2})일)/;
    const rePC = /^\[(.+?)\]\s*\[(오전|오후)\s*(\d{1,2}):(\d{2})\]\s?(.*)$/;
    const reMob = /^(\d{4})[.년]\s*(\d{1,2})[.월]\s*(\d{1,2})[.일]?\.?\s*(오전|오후)?\s*(\d{1,2}):(\d{2})\s*,\s*(.+?)\s*:\s(.*)$/;
    for (const line of text.split(/\r?\n/)) {
      let m;
      if ((m = line.match(reDate))) { date = m[1]; ymd = [m[2], m[3], m[4]]; cur = null; continue; }
      if ((m = line.match(rePC))) { cur = { who: m[1].trim(), date, t: ymd ? kTime(...ymd, m[2], m[3], m[4]) : null, text: m[5] }; msgs.push(cur); continue; }
      if ((m = line.match(reMob))) { cur = { who: m[7].trim(), date: `${m[1]}년 ${+m[2]}월 ${+m[3]}일`, t: kTime(m[1], m[2], m[3], m[4] || "", m[5], m[6]), text: m[8] }; msgs.push(cur); continue; }
      if (cur) cur.text += "\n" + line;
    }
    if (!msgs.length) msgs.push({ who: "", date: "", t: null, text });
    return msgs;
  }
  const isPhotoMsg = t => /^\s*(사진(\s*\d+장)?|이미지|photo|\S+\.(jpe?g|png|webp|heic))\s*$/i.test(t || "");

  // 성별 추정: 명시 항목 > 앞 메시지 > 군필 여부 > 원하는 점 > 키  (+ = 남, - = 여)
  function guessGender(p, ctx, face) {
    if (p.g) return { g: p.g, why: ["성별 항목"] };
    let s = 0; const why = [];
    const add = (v, w) => { s += v; why.push(w); };
    const c = ctx || "", wants = p.wants || "", raw = (p.fields || []).map(f => f.k + " " + f.v).join(" ");
    let m;
    if ((m = c.match(/여자|여성|여사친|여소|여동생|언니|누나|아가씨|女/))) add(-3, `앞 메시지 ‘${m[0]}’`);
    if ((m = c.match(/남자|남성|남사친|남소|남동생|오빠|형님|훈남|男/))) add(3, `앞 메시지 ‘${m[0]}’`);

  // ---------- 사진 ----------
  async function compress(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const max = 1400; const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      return await new Promise(res => c.toBlob(b => res(b || file), "image/jpeg", 0.85));
    } catch { return file; } finally { URL.revokeObjectURL(url); }
  }
  async function uploadPhoto(file) {
    const b = await compress(file);
    const path = `${S.me}/${crypto.randomUUID()}.jpg`;
    const { error } = await sb.storage.from("photos").upload(path, b, { contentType: "image/jpeg", upsert: false });
    if (error) throw error;
    // 다른 주선자에게 보여줄 흐린 사진 (작게 줄여 강하게 흐림)
    try { const bl = await makeBlur(b); await sb.storage.from("photos").upload(blurOf(path), bl, { contentType: "image/jpeg", upsert: true }); } catch (e) { console.warn("blur", e); }
    // 방금 올린 사진은 아직 어느 매물에도 연결 전이라 서버 주소를 못 받을 수 있어요 → 내 기기의 사진으로 바로 미리보기
    S.urls[path] = URL.createObjectURL(b);
    return path;
  }
  async function makeBlur(blob) {
    const url = URL.createObjectURL(blob);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const w = 48, hgt = Math.round(img.height * 48 / img.width);
      const c = document.createElement("canvas"); c.width = w; c.height = hgt;
      const ctx = c.getContext("2d"); ctx.filter = "blur(3px)"; ctx.drawImage(img, 0, 0, w, hgt);
      return await new Promise(res => c.toBlob(res, "image/jpeg", 0.6));
    } finally { URL.revokeObjectURL(url); }
  }
  async function signMissing() {
    const need = [...new Set(S.profiles.flatMap(p => (p.photos || []).map(x => p.full ? x : blurOf(x))))].filter(p => !S.urls[p] && !S.noBlur?.has(p));
    if (!need.length) return;
    const { data } = await sb.storage.from("photos").createSignedUrls(need, 60 * 60 * 6);
    S.noBlur ||= new Set();
    for (const d of data || []) { if (d.signedUrl) S.urls[d.path] = d.signedUrl; else if (d.path) S.noBlur.add(d.path); }
    render();
  }

    return loaded[src] ||= new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => { delete loaded[src]; rej(new Error("load " + src)); }; document.head.append(s); });
  }
  const FACE_VER = "1.7.15";
  let faceReady = null;
  function loadFace() {
    return faceReady ||= (async () => {
      await loadScript(`https://cdn.jsdelivr.net/npm/@vladmandic/face-api@${FACE_VER}/dist/face-api.js`);
      const M = `https://cdn.jsdelivr.net/npm/@vladmandic/face-api@${FACE_VER}/model/`;
      await faceapi.nets.tinyFaceDetector.loadFromUri(M);
      await faceapi.nets.ageGenderNet.loadFromUri(M);
      return true;
    })().catch(e => { console.warn("얼굴 분석 모델을 못 불러왔어요", e); faceReady = null; return false; });
  }
  // 사진 한 장 → {g:"M"|"F", prob} 또는 null. 사진은 이 브라우저 안에서만 분석되고 어디에도 보내지 않아요.
  async function faceGender(blobOrUrl) {
    if (!(await loadFace())) return null;
    const url = typeof blobOrUrl === "string" ? blobOrUrl : URL.createObjectURL(blobOrUrl);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.crossOrigin = "anonymous"; i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const r = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.4 })).withAgeAndGender();
      if (!r) return null;
      return { g: r.gender === "male" ? "M" : "F", prob: r.genderProbability };
    } catch (e) { console.warn(e); return null; }
    finally { if (typeof blobOrUrl !== "string") URL.revokeObjectURL(url); }
  }
  // 여러 장이면 가장 확신 높은 결과
  async function facesGender(files) {
    let best = null;
    for (const f of files.slice(0, 3)) { const r = await faceGender(f); if (r && (!best || r.prob > best.prob)) best = r; if (best && best.prob > 0.95) break; }
    return best;
  }

  // 사진 파일 시각: 파일명(KakaoTalk_20261015_151234567.jpg, 2026-10-15-15-12-34.jpg 등) → 없으면 파일/zip 날짜
  function photoTime(name, fallback) {
    const m = name.match(/(20\d{2})[-_.]?(\d{2})[-_.]?(\d{2})[-_ T]?(\d{2})[-_.:]?(\d{2})[-_.:]?(\d{2})?/);
    if (m) { const d = new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +(m[6] || 0)).getTime(); if (!isNaN(d)) return d; }
    return fallback || null;
  }
  const IMG_RE = /\.(jpe?g|png|webp|gif)$/i;
  async function readInputs(fileList) {
    const out = { text: "", photos: [] };
    const add = (blob, name, t) => out.photos.push({ id: Math.random().toString(36).slice(2), blob, name, t: photoTime(name, t), url: URL.createObjectURL(blob) });
    for (const f of fileList) {
      if (/\.zip$/i.test(f.name)) {
        await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
        const zip = await JSZip.loadAsync(f);
        for (const e of Object.values(zip.files)) {
          if (e.dir) continue;
          const base = e.name.split("/").pop();
          if (/\.txt$/i.test(base)) out.text += "\n" + await e.async("string");
          else if (IMG_RE.test(base)) { const b = await e.async("blob"); add(new Blob([b], { type: /png$/i.test(base) ? "image/png" : "image/jpeg" }), base, e.date ? e.date.getTime() : null); }
        }
      } else if (/\.txt$/i.test(f.name) || f.type === "text/plain") out.text += "\n" + await f.text();
      else if (f.type.startsWith("image/") || IMG_RE.test(f.name)) add(f, f.name, f.lastModified);
    }
    return out;
  }
  // 사진 → 양식 연결: ① 사진 시각에 가장 가까운 '사진' 메시지로 올린 사람을 찾고 ② 그 사람이 30분 안에 올린 양식 중 가장 가까운 것
  function matchPhotos(found, photos, msgs) {
    const photoMsgs = msgs.filter(m => m.t && isPhotoMsg(m.text));
    const MIN = 60000;
    for (const ph of photos) {
      ph.owner = null;
      if (!ph.t) continue;
      let who = null, bestPm = 3 * MIN;
      for (const pm of photoMsgs) { const d = Math.abs(pm.t - ph.t); if (d <= bestPm) { bestPm = d; who = pm.who; } }
      let best = null, bestD = Infinity;
      found.forEach((f, i) => {
        if (!f.t) return;
        const d = Math.abs(f.t - ph.t);
        const limit = who ? 30 * MIN : 15 * MIN;
        if ((who && f.who !== who) || d > limit) return;
        if (d < bestD) { bestD = d; best = i; }
      });
      ph.owner = best;
    }
  }

  async function answer(r, status) {

  // ---------- 주선 흐름: 공유 링크 · 신청 · 알림 문구 ----------
  const appUrl = () => location.origin + location.pathname;
  const shareUrl = token => `${appUrl()}?s=${token}`;
  const fmtDate = iso => { const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); toast("복사했어요. 카톡에 붙여넣으세요"); return true; }
    catch { toast("복사가 안 되면 글을 길게 눌러 직접 복사해 주세요"); return false; }
  }
  function copySheet(titleText, text, extra) {

    const btns = [h("button", { class: "btn", onclick: closeSheet }, "닫기")];

    btns.push(h("button", { class: "btn primary", onclick: () => { copyText(ta.value) || ta.select(); } }, "복사"));
    sheet(titleText, h("div", { style: "display:grid;gap:12px" }, extra || null, h("p", { class: "muted", style: "margin:0;font-size:13px", text: "필요하면 고쳐서 보내세요." }), ta), btns);
  }

    const all = ids.map(id => S.profiles.find(p => p.id === id)).filter(Boolean);
    const people = all.filter(p => p.full !== false);
    if (!people.length) return toast("주선자 승인을 받은 매물만 지인에게 보낼 수 있어요");
    const label = h("input", { type: "text", id: "sh-label", placeholder: "예) 회사동생 지훈", value: preset?.label || "" });
    const note = h("textarea", { id: "sh-note", style: "min-height:70px", placeholder: "같이 보낼 한마디 (선택)" });
    const go = h("button", { class: "btn primary", onclick: async () => {
      if (!label.value.trim()) return toast("받는 지인 이름을 적어 주세요");
      go.disabled = true;
      const { data, error } = await sb.rpc("create_share", { p_profile_ids: people.map(p => p.id), p_label: label.value.trim(), p_note: note.value.trim(), p_hours: 2 });
      go.disabled = false;

    } }, "링크 만들기");

      h("div", { class: "pics", style: "justify-content:flex-start" }, people.map(p => h("div", { class: "pic", title: title(p) }, p.photos[0] && photoUrl(p.photos[0]) ? h("img", { src: photoUrl(p.photos[0]), alt: "" }) : null))),
      h("p", { class: "muted", style: "margin:0;font-size:13px", text: `${all.length > people.length ? `승인이 필요한 ${all.length - people.length}명은 빠졌어요. ` : ""}링크를 받은 지인은 가입 없이 보고 마음에 드는 매물을 ‘신청’할 수 있어요. 링크는 만든 뒤 2시간이 지나면 자동으로 닫히고, 사진에는 내 이름이 워터마크로 찍혀요.` }),
      h("div", { class: "field" }, h("label", { for: "sh-label", text: "받는 지인" }), label),
      h("div", { class: "field" }, h("label", { for: "sh-note", text: "한마디" }), note)),
      [h("button", { class: "btn", onclick: closeSheet }, "취소"), go]);
    setTimeout(() => label.focus(), 30);
  }
  function shareResult(s, fresh) {
    const url = shareUrl(s.token);
    const text = `[솔로 장부] ${s.label}에게 추천하는 분 ${s.profileIds.length}명이야!\n보고 마음에 드는 분 있으면 ‘신청하기’ 눌러줘
⏰ 2시간 동안만 열려 (${fmtDate(s.expiresAt)}까지)\n${url}`;
    copySheet(fresh ? "링크를 만들었어요" : "보낸 링크", text, h("div", { class: "notice", text: `아래 문구를 지인에게 카톡으로 보내세요. ${fmtDate(s.expiresAt)}에 링크가 닫혀요. 지인이 신청한 매물은 신청함에 이 링크별로 모여요.` }));
  }

  // 소개 신청 (내 지인 → 상대 주선자)
  function openRequest(p, preset = {}) {
    const myOwn = S.profiles.filter(x => isMine(x) && (x.status || "solo") === "solo" && x.gender !== p.gender);
    const friend = h("input", { type: "text", id: "rq-friend", placeholder: "예) 회사동생 지훈", value: preset.friendName || "" });
    const sel = h("select", { class: "in", id: "rq-mine" }, h("option", { value: "" }, "장부에 없음 (메모로 소개)"), myOwn.map(x => h("option", { value: x.id }, `${title(x)} · ${metaLine(x)}`)));
    const note = h("textarea", { id: "rq-note", style: "min-height:90px", placeholder: "예) 95년생 개발자, 연락 잘하고 담백한 스타일이에요. 사진 보고 꼭 소개받고 싶대요!" });

    const go = h("button", { class: "btn primary", onclick: async () => {
      if (!friend.value.trim()) return toast("지인 이름을 적어 주세요");
      go.disabled = true;

        h("div", { class: "notice", text: `${mmName(p)}님이 장부를 자주 안 보면, 이 문구를 카톡으로 보내 알려 주세요.` }));

      h("div", { class: "two" },

      h("div", { class: "field" }, h("label", { for: "rq-note", text: `${mmName(p)}님에게 남길 말` }), note)),
      [h("button", { class: "btn", onclick: closeSheet }, "취소"), go]);

  // 받은 신청 → 본인(매물)에게 물어보는 링크
  async function askOwner(r) {
    const p = S.profiles.find(x => x.id === r.profileId);
    let s = S.shares.find(x => x.requestId === r.id && !x.revoked && new Date(x.expiresAt) > new Date());
    if (!s) {
      const { data, error } = await sb.rpc("create_share", { p_profile_ids: r.myProfileId ? [r.myProfileId] : [], p_label: p ? title(p) : "", p_note: "", p_hours: 72, p_request: r.id });
      if (error) return fail(error);
      await refresh();
      s = { token: data, expiresAt: new Date(Date.now() + 72 * 3600e3).toISOString() };
    }
    copySheet("본인에게 물어보기", `[솔로 장부] 너 소개받고 싶다는 사람 있어! 프로필 보고 괜찮으면 ‘좋아요’ 눌러줘 (${fmtDate(s.expiresAt)}까지)\n${shareUrl(s.token)}`,
      h("div", { class: "notice", text: "본인이 링크에서 ‘좋아요/괜찮아요’를 누르면 신청 결과가 자동으로 바뀌고, 상대 주선자에게도 보여요." }));
  }
  async function setRequest(r, status, outcome) {
    const { error } = await sb.rpc("update_request", { p_id: r.id, p_status: status, p_outcome: outcome || null });
    if (error) return fail(error);
    toast(outcome ? `‘${OUTCOME[outcome]}’로 기록했어요` : status === "accepted" ? "성사! 상대 주선자에게 알려 주세요" : status === "declined" ? "거절로 기록했어요" : "취소했어요");
    refresh();
  }

  // ---------- 지인이 여는 공유 페이지 (가입 없음) ----------
  async function showSharePage(token) {
    $("#gate").hidden = true; $("#app").hidden = true;
    const box = $("#sharepage"); box.hidden = false;
    box.replaceChildren(h("p", { class: "muted", text: "불러오는 중…" }));
    if (!S.session) {
      const { data, error } = await sb.auth.signInAnonymously();
      if (error) { box.replaceChildren(h("div", { class: "empty" }, h("h3", { text: "링크를 열 수 없어요" }), h("p", { text: "잠시 후 다시 열어 주세요." }))); return; }
      S.session = data.session;
    }
    const { data, error } = await sb.rpc("open_share", { p_token: token });
    if (error) {
      const expired = /expired/.test(error.message || "");
      box.replaceChildren(h("div", { class: "empty" }, h("h3", { text: expired ? "링크 기간이 끝났어요" : "열 수 없는 링크예요" }), h("p", { text: "보내준 친구에게 새 링크를 달라고 해 주세요." })));
      return;
    }
    const d = data; const profs = d.profiles || [];
    const leftSec = () => Math.floor((new Date(d.expires_at) - Date.now()) / 1000);
    const paths = profs.flatMap(p => p.photos || []);
    // 사진 주소도 링크 만료 시각까지만 유효하게
    if (paths.length) { const r = await sb.storage.from("photos").createSignedUrls(paths, Math.max(60, leftSec())); for (const x of r.data || []) if (x.signedUrl) S.urls[x.path] = x.signedUrl; }
    const timer = h("div", { class: "timer" });
    const tick = () => {
      const s2 = leftSec();
      if (s2 <= 0) {
        clearInterval(tickT);
        box.replaceChildren(h("div", { class: "empty" }, h("h3", { text: "링크 시간이 끝났어요" }), h("p", { text: "2시간이 지나 닫혔어요. 보내준 친구에게 새 링크를 달라고 해 주세요." })));
        return;
      }
      const hh = Math.floor(s2 / 3600), mm = Math.floor(s2 % 3600 / 60), ss = s2 % 60;
      timer.textContent = `⏰ ${hh ? hh + "시간 " : ""}${mm}분 ${String(ss).padStart(2, "0")}초 뒤 닫혀요`;
    };
    const tickT = setInterval(tick, 1000);
    const mark = () => h("div", { class: "wm", "aria-hidden": "true" }, h("span", { text: Array(6).fill(`${d.sharer}님 공유 · 외부 유출 금지     ${d.sharer}님 공유`).join("\n") }));
    const pcard = (p, actions) => {
      const ph = (p.photos || []).map(x => photoUrl(x)).filter(Boolean);
      const r = { birthYear: p.birth_year, heightCm: p.height_cm, mbtiCode: p.mbti };
      return h("article", { class: "share-card" },
        ph.length ? h("div", { class: "strip" }, ph.map(u => h("div", { class: "shot" }, h("img", { src: u, alt: "" }), mark()))) : null,
        h("div", { style: "padding:14px 16px;display:grid;gap:10px" },
          h("h3", { class: "headline", style: "font-size:22px", text: [p.birth_year && String(p.birth_year).slice(2) + "년생", p.job && p.job.split(/\n|\/|,/)[0]].filter(Boolean).join(" ") || "소개 프로필" }),
          h("div", { class: "sub", text: [metaLine(r), p.region && p.region.split("\n")[0]].filter(Boolean).join(" · ") }),
          h("dl", { class: "facts" }, (p.fields || []).map(f => h("div", null, h("dt", { text: f.k }), h("dd", { text: f.v })))),
          actions));
    };
    let myName = (() => { try { return localStorage.getItem("solo_viewer_name") || ""; } catch { return ""; } })() || (d.mode === "list" ? (d.label || "").split(" ").pop() : "");
    const nameIn = h("input", { type: "text", id: "sv-name", placeholder: "내 이름 (주선자에게 보여요)", value: myName, oninput: e => { myName = e.target.value.trim(); try { localStorage.setItem("solo_viewer_name", myName); } catch {} } });
    const head = d.mode === "ask"
      ? h("header", { class: "share-head" }, h("h1", { text: "소개받고 싶다는 분이 있어요" }),
          h("p", { text: `${d.sharer}님이 보낸 링크예요. 아래 분이 ${d.target ? [d.target.birth_year && String(d.target.birth_year).slice(2) + "년생", d.target.job].filter(Boolean).join(" ") + "님을" : "당신을"} 소개받고 싶어해요.` }),
          d.request_note ? h("p", { class: "callout", text: `“${d.request_note}”` }) : null)
      : h("header", { class: "share-head" }, h("h1", { text: `${d.label || "지인"}님께 추천하는 분들` }),
          h("p", { text: `${d.sharer}님이 보냈어요 · ${profs.length}명 · 마음에 드는 분을 ‘신청하기’ 해 주세요` }), timer,
          h("div", { class: "field" }, h("label", { for: "sv-name", text: "내 이름" }), nameIn),
          d.note ? h("p", { class: "callout", text: `“${d.note}”` }) : null);

    const pickArea = (pid, current, ask) => {
      const area = h("div", { style: "display:grid;gap:8px" });
      const draw = cur => {
        const msg = h("input", { type: "text", placeholder: ask ? "한마디 (선택)" : "주선자에게 한마디 (선택)", "aria-label": "한마디" });
        const send = async kind => {
          const { error } = await sb.rpc("pick_share", { p_token: token, p_profile: pid, p_kind: kind, p_message: msg.value.trim(), p_name: myName });
          if (error) return toast(/expired/.test(error.message || "") ? "링크 기간이 끝났어요" : "전달하지 못했어요. 다시 눌러 주세요");
          toast(kind === "want" ? "신청했어요!" : "패스했어요"); draw(kind);
        };
        area.replaceChildren(...[
          cur ? h("div", { class: "notice", style: cur === "want" ? "background:var(--ok-soft);color:var(--ok)" : "", text: cur === "want" ? (ask ? "좋다고 전했어요. 주선자가 연락처 교환을 도와줄 거예요." : `신청했어요. ${d.sharer}님이 확인하고 연결해 줄 거예요.`) : "패스했어요." }) : null,
          !cur ? msg : null,
          h("div", { class: "row" },
            h("button", { class: "btn primary", style: "flex:1;padding:12px", onclick: () => send("want") }, ask ? "좋아요, 소개 받을게요" : cur === "want" ? "신청됨 ✓" : "이 분 신청하기"),
            h("button", { class: "btn", style: "padding:12px", onclick: () => send("pass") }, ask ? "이번엔 괜찮아요" : "패스"))].filter(Boolean));
      };
      draw(current); return area;
    };
    let body;
    if (d.mode === "ask") {
      const decided = d.request_status === "accepted" || d.request_status === "declined";
      const pid = profs[0]?.id || d.target?.id;
      const actions = decided ? h("div", { class: "notice", text: d.request_status === "accepted" ? "이미 ‘좋아요’로 답했어요." : "이미 답을 보냈어요." }) : pickArea(pid, profs[0]?.my_pick, true);
      body = profs.length ? profs.map(p => pcard(p, actions))
        : [h("article", { class: "share-card", style: "padding:16px;display:grid;gap:10px" }, h("p", { style: "margin:0", text: d.request_friend ? `${d.request_friend}님 (프로필은 주선자에게 카톡으로 받아 보세요)` : "프로필은 주선자에게 카톡으로 받아 보세요." }), actions)];
    } else body = profs.map(p => pcard(p, (p.status || "solo") === "solo" ? pickArea(p.id, p.my_pick, false) : h("div", { class: "notice", text: "지금은 다른 분과 진행 중이에요." })));
    if (d.mode === "ask") head.append(timer);
    tick();
    if (leftSec() <= 0) return;
    box.replaceChildren(head, h("div", { class: "share-list" }, body),
      h("p", { class: "muted", style: "font-size:12px;text-align:center", text: "이 페이지는 받은 사람만 보도록 보낸 링크예요. 캡처해서 다른 사람에게 보내지 말아 주세요." }));
  }

  // ---------- 데이터 로드 ----------
  let refreshT = null;
  async function refresh() {
    const [pr, rq, mb, shs, pk, ac] = await Promise.all([
      sb.rpc("list_profiles"),
      sb.from("requests").select("*"),
      sb.from("members").select("id,name,is_admin,joined_at"),
      sb.from("shares").select("*").order("created_at", { ascending: false }).limit(200),
      sb.from("share_picks").select("*").order("created_at", { ascending: false }).limit(500),
      sb.from("access_requests").select("*").order("created_at", { ascending: false }).limit(300),
    ]);
    S.access = ac.data || [];
    S.shares = (shs.data || []).map(shareFromRow);
    S.picks = (pk.data || []).map(pickFromRow);
    if (pr.error) { fail(pr.error); return; }
    S.profiles = (pr.data || []).map(fromRow);
    S.requests = (rq.data || []).map(reqFromRow);
    S.members = mb.data || [];
    S.names = Object.fromEntries(S.members.map(m => [m.id, m.name]));
    const meRow = S.members.find(m => m.id === S.me);
    if (!meRow) { showGate(); return; }   // 관리자가 내보낸 경우
    S.isAdmin = !!meRow.is_admin; S.myName = meRow.name;
    S.loaded = true; render(); signMissing();
  }
  const refreshSoon = () => { clearTimeout(refreshT); refreshT = setTimeout(refresh, 300); };

  // ---------- 로그인 (휴대폰 번호 + PIN) ----------
  async function ensureSession() {
    if (S.session) return true;
    const { data, error } = await sb.auth.signInAnonymously();
    if (error) { console.error(error); toast("로그인 준비에 실패했어요. Supabase에서 익명 로그인을 켰는지 확인해 주세요."); return false; }
    S.session = data.session; return true;
  }
  const fmtPhone = v => { const d = v.replace(/\D/g, "").slice(0, 11); return d.length < 4 ? d : d.length < 8 ? `${d.slice(0, 3)}-${d.slice(3)}` : `${d.slice(0, 3)}-${d.slice(3, d.length - 4)}-${d.slice(-4)}`; };
  function showGate() {
    $("#app").hidden = true; $("#gate").hidden = false;
    const box = $("#gate-box");
    if (!sb) {
      box.replaceChildren(h("h1", { text: "솔로 장부" }), h("p", { text: "config.js에 Supabase 주소와 키를 넣어야 사이트가 동작해요. 설치 가이드(README.md)를 참고하세요." }));
      return;
    }
    const phone = h("input", { type: "text", id: "lg-phone", inputmode: "numeric", autocomplete: "tel", placeholder: "010-0000-0000" });
    phone.addEventListener("input", () => { phone.value = fmtPhone(phone.value); });
    const pin = h("input", { type: "password", id: "lg-pin", inputmode: "numeric", autocomplete: "current-password", placeholder: "숫자 4~8자리", maxlength: "8" });
    const name = h("input", { type: "text", id: "lg-name", placeholder: "장부에 표시될 이름" });
    const code = h("input", { type: "text", id: "lg-code", placeholder: "친구에게 받은 코드", autocomplete: "off" });
    const joinBox = h("div", { style: "display:grid;gap:14px" , hidden: true },
      h("p", { class: "notice", style: "margin:0", text: "처음 오셨네요! 이름과 초대코드를 입력하면 방금 정한 PIN으로 가입돼요." }),
      h("div", { class: "field" }, h("label", { for: "lg-name", text: "내 이름" }), name),
      h("div", { class: "field" }, h("label", { for: "lg-code", text: "초대코드" }), code));
    const go = h("button", { class: "btn primary", style: "padding:12px" }, "입장하기");
    async function submit() {
      if (phone.value.replace(/\D/g, "").length < 10) return toast("휴대폰 번호를 확인해 주세요");
      if (!/^\d{4,8}$/.test(pin.value)) return toast("PIN은 숫자 4~8자리예요");
      if (!joinBox.hidden && !name.value.trim()) return toast("이름을 적어 주세요");
      go.disabled = true;
      try {
        if (!(await ensureSession())) return;
        const { data, error } = await sb.rpc("phone_login", { p_phone: phone.value, p_pin: pin.value, p_code: joinBox.hidden ? null : code.value, p_name: joinBox.hidden ? null : name.value });
        if (error) {
          const m = error.message || "";
          if (/need_join/.test(m)) { joinBox.hidden = false; name.focus(); return; }
          if (/wrong_code/.test(m)) return toast("초대코드가 맞지 않아요");
          if (/locked/.test(m)) return toast("PIN을 5번 틀려서 10분 동안 잠겼어요");
          if (/bad_phone/.test(m)) return toast("휴대폰 번호 형식을 확인해 주세요");
          if (/bad_pin/.test(m)) return toast("PIN은 숫자 4~8자리예요");
          return fail(error);
        }
        if (data === "wrong_pin") return toast("PIN이 맞지 않아요. 잊었으면 관리자에게 초기화를 부탁하세요.");
        toast(data === "joined" ? "환영해요! 장부에 입장했어요" : "로그인했어요");
        await enterApp();
      } finally { go.disabled = false; }
    }
    go.addEventListener("click", submit);
    [phone, pin, name, code].forEach(i => i.addEventListener("keydown", e => { if (e.key === "Enter") submit(); }));
    box.replaceChildren(h("h1", { text: "솔로 장부" }),
      h("p", { text: "우리끼리 소개팅 매물 관리. 휴대폰 번호와 PIN으로 들어와요." }),
      h("div", { class: "field" }, h("label", { for: "lg-phone", text: "휴대폰 번호" }), phone),
      h("div", { class: "field" }, h("label", { for: "lg-pin", text: "PIN" }), pin, h("span", { class: "hint", text: "처음이면 지금 쓸 PIN을 새로 정하면 돼요." })),
      joinBox, go,
      h("p", { style: "font-size:12px", text: "문자 인증은 하지 않아요. 번호는 로그인 아이디로만 쓰이고 다른 멤버에게 보이지 않아요." }));
    setTimeout(() => phone.focus(), 30);
  }
  function openPinChange() {
    const oldP = h("input", { type: "password", id: "pc-old", inputmode: "numeric", maxlength: "8" });
    const newP = h("input", { type: "password", id: "pc-new", inputmode: "numeric", maxlength: "8", placeholder: "숫자 4~8자리" });
    sheet("PIN 변경", h("div", { style: "display:grid;gap:14px;max-width:360px" },
      h("div", { class: "field" }, h("label", { for: "pc-old", text: "지금 PIN" }), oldP),
      h("div", { class: "field" }, h("label", { for: "pc-new", text: "새 PIN" }), newP)),
      [h("button", { class: "btn", onclick: closeSheet }, "취소"), h("button", { class: "btn primary", onclick: async () => {
        const { error } = await sb.rpc("change_pin", { p_old: oldP.value, p_new: newP.value });
        if (error) { const m = error.message || ""; return toast(/wrong_pin/.test(m) ? "지금 PIN이 맞지 않아요" : /bad_pin/.test(m) ? "새 PIN은 숫자 4~8자리예요" : "바꾸지 못했어요"); }
        toast("PIN을 바꿨어요"); closeSheet();
      } }, "변경")]);
  }
  let channel = null, signTimer = null;
  async function enterApp() {
    const { data } = await sb.rpc("whoami");
    const me = data && data[0];
    if (!me) { showGate(); return; }
    S.me = me.id; S.myName = me.name; S.phoneTail = me.phone_tail; S.isAdmin = !!me.is_admin;
    $("#gate").hidden = true; $("#app").hidden = false;
    try { S.lastSeen = localStorage.getItem("solo_last_seen_" + S.me) || null; } catch {}
    const markSeen = () => { try { localStorage.setItem("solo_last_seen_" + S.me, new Date().toISOString()); } catch {} };
    document.addEventListener("visibilitychange", () => { if (document.hidden) markSeen(); });
    window.addEventListener("pagehide", markSeen);
    render(); await refresh();
    if (!channel) channel = sb.channel("ledger")
      .on("postgres_changes", { event: "*", schema: "public", table: "profiles" }, refreshSoon)
      .on("postgres_changes", { event: "*", schema: "public", table: "requests" }, refreshSoon)
      .on("postgres_changes", { event: "*", schema: "public", table: "share_picks" }, refreshSoon)
      .on("postgres_changes", { event: "*", schema: "public", table: "access_requests" }, refreshSoon)
      .subscribe();
    if (!signTimer) signTimer = setInterval(() => { S.urls = {}; signMissing(); }, 5 * 60 * 60 * 1000);
    // 블라인드 매물 변경은 실시간 알림이 안 올 수 있어 1분마다 + 화면 돌아올 때 새로고침
    setInterval(() => { if (!document.hidden) refreshSoon(); }, 60000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshSoon(); });
  }

  // ---------- events ----------
  document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => { S.tab = b.dataset.tab; render(); }));
  document.querySelectorAll("[data-g]").forEach(b => b.addEventListener("click", () => { S.g = b.dataset.g; render(); }));
  document.querySelectorAll("[data-s]").forEach(b => b.addEventListener("click", () => { S.s = b.dataset.s; render(); }));
  $("#q").addEventListener("input", e => { S.q = e.target.value; render(); });
  $("#btn-delmode").addEventListener("click", () => { S.delMode = true; S.delSel.clear(); render(); });
  $("#btn-addall").addEventListener("click", () => {
    const ids = filtered().filter(cartable).map(p => p.id);
    const allIn = ids.length && ids.every(id => S.basket.has(id));
    ids.forEach(id => allIn ? S.basket.delete(id) : S.basket.add(id));
    toast(allIn ? `${ids.length}명을 장바구니에서 뺐어요` : `${ids.length}명을 장바구니에 담았어요`);
    render();
  });
  $("#btn-add").addEventListener("click", () => openEditor());
  $("#btn-import").addEventListener("click", openImport);
  $("#btn-admin").addEventListener("click", openAdmin);
  $("#btn-pin").addEventListener("click", openPinChange);
  $("#btn-logout").addEventListener("click", async () => {
    await sb.rpc("phone_logout");
    if (channel) { sb.removeChannel(channel); channel = null; }
    await sb.auth.signOut();
    S.session = null; S.me = null; S.profiles = []; S.loaded = false; showGate();
  });

  // ---------- boot ----------
  if (!sb) { showGate(); return; }
  const shareToken = new URLSearchParams(location.search).get("s");
  sb.auth.getSession().then(({ data }) => {
    S.session = data.session;
    if (shareToken) { showSharePage(shareToken); return; }
    if (data.session) enterApp(); else showGate();
  });
})();
</script>
</body>
</html>
